<!DOCTYPE html>
<html lang="pt-BR">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self' data:; frame-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salto Cibernético - BUNDIX</title>
  <link rel="stylesheet" href="../../assets/theme.css"><link rel="stylesheet" href="../../assets/game-layout.css">
  <style>
    #plat-canvas {
      border: 2px solid #06b6d4;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      max-width: 100%;
    }
  </style>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg"></head>
<body>

  <header class="game-header">
    <a href="../../index.html" class="back-btn">← BUNDIX</a>
    <div class="game-title-header">🏃 Salto Cibernético</div>
    <div class="header-actions">
      <button class="action-btn" id="btn-restart">🔄 Reiniciar Fase</button>
    </div>
  </header>

  <main class="game-container-main">
    <!-- Placar -->
    <div class="game-scoreboard">
      <div class="score-box">
        <div class="score-label">Moedas</div>
        <div class="score-value" id="coins-count" style="color: #eab308;">0 / 5</div>
      </div>
      <div class="score-box">
        <div class="score-label">Status</div>
        <div class="score-value" id="game-status" style="color: #06b6d4; font-size: 1.1rem;">Em Jogo</div>
      </div>
      <div class="score-box">
        <div class="score-label">Tentativas</div>
        <div class="score-value" id="attempts-count">1</div>
      </div>
    </div>

    <!-- Arena do Jogo -->
    <div class="game-viewport">
      <canvas id="plat-canvas" width="640" height="360"></canvas>
    </div>

    <!-- Controles na Tela -->
    <div class="touch-controls" id="touch-controls">
      <div class="dpad-row">
        <button class="touch-btn" id="t-left" style="width: 70px;">◀</button>
        <button class="touch-btn" id="t-jump" style="width: 90px; background: #06b6d4;">PULO</button>
        <button class="touch-btn" id="t-right" style="width: 70px;">▶</button>
      </div>
    </div>

    <!-- Instruções -->
    <div class="game-instructions-card">
      <h3>Instruções do Jogo</h3>
      <div class="instruction-grid">
        <div class="instruction-item">
          <strong>Correr:</strong> Use <span class="key-badge">A</span> / <span class="key-badge">D</span> ou <span class="key-badge">←</span> / <span class="key-badge">→</span>.
        </div>
        <div class="instruction-item">
          <strong>Pular:</strong> Use <span class="key-badge">W</span>, <span class="key-badge">↑</span> ou <span class="key-badge">Espaço</span>.
        </div>
        <div class="instruction-item">
          <strong>Objetivo:</strong> Colete as moedas douradas, evite os espinhos vermelhos e chegue à bandeira neon!
        </div>
      </div>
    </div>
  </main>

  <script src="platformer.js"></script>
</body>
</html>
