<!DOCTYPE html>
<html lang="pt-BR">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self' data:; frame-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Neon - PLAYNOVA</title>
  <link rel="stylesheet" href="../../assets/theme.css"><link rel="stylesheet" href="../../assets/game-layout.css">
  <style>
    .grid-2048-container {
      background: #171329;
      border: 3px solid #2b234d;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: min(360px, 86vw);
      height: min(360px, 86vw);
      user-select: none;
      touch-action: none;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
    }
    .tile-cell {
      background: #0f0c1f;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      transition: all 0.12s ease-in-out;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .tile-2 { background: #1e293b; color: #f8fafc; }
    .tile-4 { background: #334155; color: #f8fafc; }
    .tile-8 { background: #9333ea; color: #fff; box-shadow: 0 0 8px rgba(147, 51, 234, 0.5); }
    .tile-16 { background: #7c3aed; color: #fff; box-shadow: 0 0 10px rgba(124, 58, 237, 0.6); }
    .tile-32 { background: #2563eb; color: #fff; box-shadow: 0 0 10px rgba(37, 99, 235, 0.6); }
    .tile-64 { background: #0284c7; color: #fff; box-shadow: 0 0 12px rgba(2, 132, 199, 0.6); }
    .tile-128 { background: #059669; color: #fff; box-shadow: 0 0 12px rgba(5, 150, 105, 0.7); font-size: 1.4rem; }
    .tile-256 { background: #16a34a; color: #fff; box-shadow: 0 0 14px rgba(22, 163, 74, 0.7); font-size: 1.4rem; }
    .tile-512 { background: #ca8a04; color: #fff; box-shadow: 0 0 15px rgba(202, 138, 4, 0.7); font-size: 1.4rem; }
    .tile-1024 { background: #ea580c; color: #fff; box-shadow: 0 0 18px rgba(234, 88, 12, 0.8); font-size: 1.2rem; }
    .tile-2048 { background: #dc2626; color: #fff; box-shadow: 0 0 22px rgba(220, 38, 38, 0.9); font-size: 1.2rem; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  </style>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg"></head>
<body>

  <header class="game-header">
    <a href="../../index.html" class="back-btn">← PLAYNOVA</a>
    <div class="game-title-header">2048 Neon</div>
    <div class="header-actions">
      <button class="action-btn" id="btn-restart">Novo Jogo</button>
    </div>
  </header>

  <main class="game-container-main">
    <!-- Placar -->
    <div class="game-scoreboard">
      <div class="score-box">
        <div class="score-label">Pontuação</div>
        <div class="score-value" id="current-score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Melhor Pontuação</div>
        <div class="score-value" id="best-score" style="color: #eab308;">0</div>
      </div>
    </div>

    <!-- Arena 2048 -->
    <div class="game-viewport" style="padding: 20px;">
      <div class="grid-2048-container" id="grid-container">
        <!-- Células geradas via JS -->
      </div>
    </div>

    <!-- Controles na Tela -->
    <div class="touch-controls" id="touch-controls">
      <button class="touch-btn" id="t-up">▲</button>
      <div class="dpad-row">
        <button class="touch-btn" id="t-left">◀</button>
        <button class="touch-btn" id="t-down">▼</button>
        <button class="touch-btn" id="t-right">▶</button>
      </div>
    </div>

    <!-- Instruções -->
    <div class="game-instructions-card">
      <h3>Como Jogar</h3>
      <div class="instruction-grid">
        <div class="instruction-item">
          <strong>Movimento:</strong> Use as setas do teclado, <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> ou deslize o dedo.
        </div>
        <div class="instruction-item">
          <strong>Fusão:</strong> Blocos com o mesmo número se somam ao colidir (2+2=4, 4+4=8...).
        </div>
        <div class="instruction-item">
          <strong>Meta:</strong> Forme o bloco com o número <strong>2048</strong>!
        </div>
      </div>
    </div>
  </main>

  <script src="2048.js"></script>
</body>
</html>
