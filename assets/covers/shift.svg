<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg_shift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="cyber_shift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dbef"/>
      <stop offset="50%" stop-color="#7776ff"/>
      <stop offset="100%" stop-color="#ec65e8"/>
    </linearGradient>
    <filter id="glow_shift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="256" height="256" rx="24" fill="url(#bg_shift)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 64 H256 M0 128 H256 M0 192 H256 M64 0 V256 M128 0 V256 M192 0 V256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glowing Outer Neon Rim -->
  <rect x="5" y="5" width="246" height="246" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Center Artwork Container -->
  <g transform="translate(128, 96)">
    
  <!-- Half Black Half White Disc -->
  <circle r="36" fill="#000" stroke="#fff" stroke-width="2"/>
  <path d="M0 -36 A36 36 0 0 1 0 36 Z" fill="#fff"/>
  <!-- Inverted Runner Silhouette -->
  <circle cx="-12" cy="-10" r="5" fill="#fff"/>
  <circle cx="12" cy="10" r="5" fill="#000"/>

  </g>

  <!-- Title Plate -->
  <rect x="14" y="168" width="228" height="72" rx="14" fill="rgba(8,13,26,0.92)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="24" y="168" width="208" height="2" fill="url(#cyber_shift)"/>

  <!-- Game Title -->
  <text x="128" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SHIFT</text>
  
  <!-- Subtitle / Tag -->
  <text x="128" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#29dbef" text-anchor="middle" letter-spacing="1">★ INVERTA O MUNDO</text>
</svg>