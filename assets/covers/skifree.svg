<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg_skifree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cyber_skifree" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dbef"/>
      <stop offset="50%" stop-color="#7776ff"/>
      <stop offset="100%" stop-color="#ec65e8"/>
    </linearGradient>
    <filter id="glow_skifree" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="256" height="256" rx="24" fill="url(#bg_skifree)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 64 H256 M0 128 H256 M0 192 H256 M64 0 V256 M128 0 V256 M192 0 V256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glowing Outer Neon Rim -->
  <rect x="5" y="5" width="246" height="246" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Center Artwork Container -->
  <g transform="translate(128, 96)">
    
  <!-- Snowy Mountain Peak -->
  <polygon points="0,-38 38,24 -38,24" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="0,-38 12,-10 0,24 -20,6" fill="#cbd5e1"/>
  <!-- Skier trails -->
  <path d="M-10 6 Q0 18 20 28" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <!-- Pine trees -->
  <polygon points="-24,10 -16,24 -32,24" fill="#065f46"/>
  <polygon points="24,12 32,24 16,24" fill="#065f46"/>

  </g>

  <!-- Title Plate -->
  <rect x="14" y="168" width="228" height="72" rx="14" fill="rgba(8,13,26,0.92)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="24" y="168" width="208" height="2" fill="url(#cyber_skifree)"/>

  <!-- Game Title -->
  <text x="128" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SKIFREE</text>
  
  <!-- Subtitle / Tag -->
  <text x="128" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#29dbef" text-anchor="middle" letter-spacing="1">★ ESCAPE DO MONSTRO</text>
</svg>