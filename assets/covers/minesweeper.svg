<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg_minesweeper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cyber_minesweeper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dbef"/>
      <stop offset="50%" stop-color="#7776ff"/>
      <stop offset="100%" stop-color="#ec65e8"/>
    </linearGradient>
    <filter id="glow_minesweeper" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="256" height="256" rx="24" fill="url(#bg_minesweeper)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 64 H256 M0 128 H256 M0 192 H256 M64 0 V256 M128 0 V256 M192 0 V256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glowing Outer Neon Rim -->
  <rect x="5" y="5" width="246" height="246" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Center Artwork Container -->
  <g transform="translate(128, 96)">
    
  <!-- Radar circles -->
  <circle r="44" fill="#021c16" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <circle r="28" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="-44" y1="0" x2="44" y2="0" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="-44" x2="0" y2="44" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <!-- Naval Mine -->
  <circle r="18" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
  <!-- Spikes -->
  <path d="M0 -26 V-18 M0 18 V26 M-26 0 H-18 M18 0 H26 M-16 -16 L-10 -10 M10 10 L16 16 M-16 16 L-10 10 M10 -10 L16 -16" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="6" fill="#ef4444" filter="url(#glow_minesweeper)"/>

  </g>

  <!-- Title Plate -->
  <rect x="14" y="168" width="228" height="72" rx="14" fill="rgba(8,13,26,0.92)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="24" y="168" width="208" height="2" fill="url(#cyber_minesweeper)"/>

  <!-- Game Title -->
  <text x="128" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CAMPO MINADO</text>
  
  <!-- Subtitle / Tag -->
  <text x="128" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#29dbef" text-anchor="middle" letter-spacing="1">★ RADAR TÁTICO</text>
</svg>