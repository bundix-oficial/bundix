<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg_papas-sushiria" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cyber_papas-sushiria" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dbef"/>
      <stop offset="50%" stop-color="#7776ff"/>
      <stop offset="100%" stop-color="#ec65e8"/>
    </linearGradient>
    <filter id="glow_papas-sushiria" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="256" height="256" rx="24" fill="url(#bg_papas-sushiria)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 64 H256 M0 128 H256 M0 192 H256 M64 0 V256 M128 0 V256 M192 0 V256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glowing Outer Neon Rim -->
  <rect x="5" y="5" width="246" height="246" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Center Artwork Container -->
  <g transform="translate(128, 96)">
    
  <!-- Maki roll -->
  <ellipse cx="-14" cy="4" rx="16" ry="14" fill="#111827" stroke="#374151" stroke-width="2"/>
  <ellipse cx="-14" cy="4" rx="11" ry="9" fill="#f8fafc"/>
  <circle cx="-14" cy="4" r="5" fill="#f97316"/>
  <!-- Second roll -->
  <ellipse cx="16" cy="4" rx="16" ry="14" fill="#111827" stroke="#374151" stroke-width="2"/>
  <ellipse cx="16" cy="4" rx="11" ry="9" fill="#f8fafc"/>
  <circle cx="16" cy="4" r="5" fill="#22c55e"/>
  <!-- Chopsticks -->
  <line x1="-32" y1="-28" x2="32" y2="28" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <line x1="-28" y1="-32" x2="36" y2="24" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  </g>

  <!-- Title Plate -->
  <rect x="14" y="168" width="228" height="72" rx="14" fill="rgba(8,13,26,0.92)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="24" y="168" width="208" height="2" fill="url(#cyber_papas-sushiria)"/>

  <!-- Game Title -->
  <text x="128" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PAPA'S SUSHIRIA</text>
  
  <!-- Subtitle / Tag -->
  <text x="128" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#29dbef" text-anchor="middle" letter-spacing="1">★ SUSHI ARTESANAL</text>
</svg>