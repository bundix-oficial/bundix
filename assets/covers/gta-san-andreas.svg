<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg_gta-san-andreas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180728"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="cyber_gta-san-andreas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dbef"/>
      <stop offset="50%" stop-color="#7776ff"/>
      <stop offset="100%" stop-color="#ec65e8"/>
    </linearGradient>
    <filter id="glow_gta-san-andreas" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="256" height="256" rx="24" fill="url(#bg_gta-san-andreas)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 64 H256 M0 128 H256 M0 192 H256 M64 0 V256 M128 0 V256 M192 0 V256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glowing Outer Neon Rim -->
  <rect x="5" y="5" width="246" height="246" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Center Artwork Container -->
  <g transform="translate(128, 96)">
    
  <!-- Palm Trees -->
  <path d="M-34 24 Q-28 -4 -20 -28" stroke="#000" stroke-width="4" fill="none"/>
  <path d="M-20 -28 C-32 -34 -44 -26 -40 -16 M-20 -28 C-18 -38 -8 -36 -4 -28 M-20 -28 C-10 -30 2 -24 4 -16" stroke="#000" stroke-width="3" fill="none"/>
  <!-- Lowrider Car Silhouette -->
  <path d="M-24 16 L-16 6 L12 6 L26 14 L34 16 L34 24 L-24 24 Z" fill="#000"/>
  <circle cx="-12" cy="24" r="6" fill="#eab308" stroke="#000" stroke-width="2"/>
  <circle cx="20" cy="24" r="6" fill="#eab308" stroke="#000" stroke-width="2"/>
  <!-- Police Stars -->
  <text x="0" y="-16" font-size="14" fill="#eab308" text-anchor="middle" letter-spacing="3">★★★★★</text>

  </g>

  <!-- Title Plate -->
  <rect x="14" y="168" width="228" height="72" rx="14" fill="rgba(8,13,26,0.92)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="24" y="168" width="208" height="2" fill="url(#cyber_gta-san-andreas)"/>

  <!-- Game Title -->
  <text x="128" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">GTA SAN ANDREAS</text>
  
  <!-- Subtitle / Tag -->
  <text x="128" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#29dbef" text-anchor="middle" letter-spacing="1">★ DEMAKE 2D RETRÔ</text>
</svg>