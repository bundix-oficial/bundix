<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff266"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#2b3654" stroke-width="2"/>

  <!-- 3D Base Shadow for Letter B -->
  <rect x="11" y="14" width="42" height="42" rx="10" fill="#996300"/>

  <!-- Golden 3D Block -->
  <rect x="11" y="10" width="42" height="42" rx="10" fill="url(#gold)" stroke="#0e1726" stroke-width="2.5"/>
  <rect x="13" y="12" width="38" height="20" rx="8" fill="url(#gloss)"/>

  <!-- Letter B -->
  <text x="32" y="42" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="32" fill="#ffffff" stroke="#78350f" stroke-width="2.5" paint-order="stroke fill">B</text>

  <!-- Arcade Sparkles -->
  <path d="M48 6 L50 9 L53 10 L50 11 L48 14 L46 11 L43 10 L46 9 Z" fill="#38bdf8"/>
  <circle cx="14" cy="50" r="2.5" fill="#f43f5e"/>
</svg>
